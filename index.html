<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts CDN  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">


    <title>Text Limit Finder</title>
    <style>
        * {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>

<body>
    <main>
        <section class="h-screen flex justify-center items-center">
            <div class=" shadow-2xl  py-5 px-5 rounded-2xl">
                <p class="text-3xl text-violet-700 font-semibold text-center pb-6">Find Your Text Limit</p>
                <textarea
                    class=" bg-green-50  border-none rounded-md  px-4 py-3 focus:ring-2 focus:ring-violet-600 focus:outline-none"
                    name="" id="textarea" cols="50" rows="10" placeholder="Write your text here....."></textarea>

                <p class="text-end" id="limitChecker">0/100</p>
            </div>
        </section>
    </main>


    <script src="./script.js"></script>
</body>

</html>
